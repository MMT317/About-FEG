<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMT Financial and Insurance | Freedom Equity Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1628;
            --deep-blue: #0f2341;
            --royal: #1a3a6b;
            --accent-gold: #c9a84c;
            --light-gold: #e8d5a0;
            --pale-gold: #f5eed9;
            --white: #ffffff;
            --off-white: #f8f7f4;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5e;
            --text-light: #8a8a9e;
            --border-subtle: rgba(201, 168, 76, 0.2);
            --shadow-soft: 0 4px 24px rgba(10, 22, 40, 0.08);
            --shadow-medium: 0 8px 40px rgba(10, 22, 40, 0.12);
            --shadow-strong: 0 16px 64px rgba(10, 22, 40, 0.16);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            background: transparent;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* ─── HEADER ─── */
        header {
            background: linear-gradient(165deg, var(--navy) 0%, var(--deep-blue) 40%, var(--royal) 100%);
            color: var(--white);
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem 1.5rem 1rem;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .feg-coin-logo {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .feg-coin-logo:hover { transform: scale(1.05); }

        .feg-family-logo {
            width: 200px;
            height: auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            transition: transform 0.3s ease;
        }

        .feg-family-logo:hover { transform: scale(1.05); }

        .header-divider {
            width: 1px;
            height: 70px;
            background: linear-gradient(to bottom, transparent, var(--accent-gold), transparent);
        }

        .header-content {
            text-align: center;
            padding: 1.5rem 1.5rem 2.5rem;
            position: relative;
            z-index: 2;
        }

        .header-content h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-bottom: 0.25rem;
            background: linear-gradient(135deg, var(--white) 0%, var(--light-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-content .subtitle {
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--light-gold);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        .header-content .motto {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-style: italic;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.05em;
        }

        .header-gold-bar {
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        /* ─── NAV ─── */
        nav {
            background: var(--white);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-soft);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.25s ease;
        }

        nav a:hover {
            color: var(--royal);
            background: rgba(26, 58, 107, 0.06);
        }

        /* ─── MAIN CONTENT ─── */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        section {
            padding: 3.5rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        section:last-of-type { border-bottom: none; }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 0.75rem;
        }

        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 1.25rem;
            line-height: 1.25;
        }

        h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--deep-blue);
            margin-bottom: 0.75rem;
            margin-top: 1.5rem;
        }

        p { margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.95rem; }

        .highlight-card {
            background: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
            margin: 1.5rem 0;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--royal));
            border-radius: 12px 12px 0 0;
        }

        .highlight-card.gold-accent::before {
            background: linear-gradient(90deg, var(--accent-gold), var(--light-gold));
        }

        .rating-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .rating-item {
            background: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s ease;
        }

        .rating-item:hover { transform: translateY(-2px); }

        .rating-agency {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 0.35rem;
        }

        .rating-score {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--royal);
        }

        .rating-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .stat-row {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        .stat-item {
            flex: 1;
            min-width: 140px;
            background: linear-gradient(135deg, var(--navy) 0%, var(--royal) 100%);
            color: var(--white);
            border-radius: 10px;
            padding: 1.25rem;
            text-align: center;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--light-gold);
        }

        .stat-desc {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.8);
            margin-top: 0.25rem;
        }

        .affiliation-diagram {
            background: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2rem;
            margin: 1.5rem 0;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .diagram-tier {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            display: inline-block;
            margin: 0.5rem 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .tier-fnf {
            background: linear-gradient(135deg, var(--navy), var(--royal));
            color: var(--white);
            font-size: 1rem;
            padding: 1rem 2rem;
        }

        .tier-fg {
            background: linear-gradient(135deg, var(--royal), #2a5aa0);
            color: var(--white);
        }

        .tier-feg {
            background: linear-gradient(135deg, var(--accent-gold), #b8933e);
            color: var(--navy);
        }

        .tier-mmt {
            background: var(--navy);
            color: var(--light-gold);
            border: 2px solid var(--accent-gold);
        }

        .diagram-connector {
            width: 2px;
            height: 28px;
            background: linear-gradient(to bottom, var(--royal), var(--accent-gold));
            margin: 0 auto;
        }

        .important-note {
            background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.04));
            border-left: 3px solid var(--accent-gold);
            padding: 1.25rem 1.5rem;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        .important-note strong {
            color: var(--navy);
        }

        .source-cite {
            font-size: 0.75rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* ─── CONTACT SECTION ─── */
        /* ─── FOOTER ─── */
        footer {
            background: linear-gradient(165deg, var(--navy) 0%, var(--deep-blue) 100%);
            color: rgba(255,255,255,0.7);
            padding: 2.5rem 1.5rem;
            text-align: center;
            margin-top: 2rem;
        }

        .footer-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-logos img {
            height: 60px;
            width: auto;
            opacity: 0.9;
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.3));
        }

        .footer-divider-line {
            width: 80px;
            height: 1px;
            background: var(--accent-gold);
            margin: 1rem auto;
        }

        footer p {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.55);
            margin-bottom: 0.4rem;
        }

        footer .footer-motto {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-style: italic;
            color: var(--light-gold);
            margin-bottom: 1rem;
        }

        footer a {
            color: var(--light-gold);
            text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }

        .disclaimer {
            max-width: 720px;
            margin: 1.5rem auto 0;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            line-height: 1.6;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .header-top { gap: 1rem; padding: 1.5rem 1rem 0.75rem; }
            .feg-coin-logo { width: 80px; }
            .feg-family-logo { width: 150px; }
            .header-divider { display: none; }
            .header-content { padding: 1rem 1rem 2rem; }
            nav ul { gap: 0.2rem; }
            nav a { font-size: 0.72rem; padding: 0.4rem 0.6rem; }
            section { padding: 2.5rem 0; }

            .rating-grid { grid-template-columns: repeat(2, 1fr); }
            .highlight-card { padding: 1.5rem; }

            .stat-row { gap: 0.75rem; }
            .stat-item { min-width: 120px; padding: 1rem; }
            .footer-logos img { height: 45px; }
        }

        @media (max-width: 480px) {
            .rating-grid { grid-template-columns: 1fr 1fr; }
            .stat-row { flex-direction: column; }
            .stat-item { min-width: 100%; }
            nav ul { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding: 0.6rem 0.75rem; }
            nav a { white-space: nowrap; font-size: 0.68rem; }
        }

        /* ─── ANIMATIONS ─── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        section { animation: fadeInUp 0.6s ease-out; }
    
        .hero-banner img {
            transition: opacity 0.3s ease;
        }
        @media (max-width: 768px) {
            .hero-banner { max-height: 260px !important; }
            .hero-banner img { max-height: 260px !important; }
        }
        @media (max-width: 480px) {
            .hero-banner { max-height: 180px !important; }
            .hero-banner img { max-height: 180px !important; }
        }
    </style>

    visibility: hidden !important;
